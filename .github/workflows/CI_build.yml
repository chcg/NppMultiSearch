name: CI_build

on: [push, pull_request]

jobs:
  build:

    runs-on: windows-latest
    env:
      Projectname: NppMultiSearch
    strategy:
      fail-fast: false
      matrix:
        build_platform: [x64]

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Build of plugin dll
      working-directory: .\
      run: |
           .\build.ps1

    - uses: devops-actions/action-get-tag@v1.0.5
      id: tagName
      with:
        default: v0.0.0 # Optional: Default version when tag not found

    - name: zip artifacts for Release ${{ matrix.build_platform }}
      run: |
           7z a ${{ env.Projectname }}_${{ steps.tagName.outputs.tag }}_${{ matrix.build_platform }}.zip .\dist\NppMultiSearch\${{ env.Projectname }}.dll

    - name: Archive artifacts for Release ${{ matrix.build_platform }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.Projectname }}_${{ steps.tagName.outputs.tag }}_${{ matrix.build_platform }}.zip
        path: ${{ env.Projectname }}_${{ steps.tagName.outputs.tag }}_${{ matrix.build_platform }}.zip

    - name: Create release on tagging
      uses: softprops/action-gh-release@v3
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: ${{ env.Projectname }}_${{ steps.tagName.outputs.tag }}_${{ matrix.build_platform }}.zip