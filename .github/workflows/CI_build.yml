name: CI_build

on: [push, pull_request]

jobs:
  build:

    runs-on: windows-latest
    env:
      Projectname: NppMultiSearch
    strategy:
      fail-fast: false
      matrix:
        build_platform: [x64]

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Build of plugin dll
      working-directory: .\
      run: |
           .\build.ps1

    - name: Archive artifacts for Release ${{ matrix.build_platform }}
      uses: actions/upload-artifact@v7
      with:
        path: ./dist/${{ env.Projectname }}_**_${{ matrix.build_platform }}.zip
        archive: false

    - name: Create release on tagging
      uses: softprops/action-gh-release@v3
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: ${{ env.Projectname }}_**_${{ matrix.build_platform }}.zip